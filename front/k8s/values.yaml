namespace: pre-jf-zgz-emergency-map-front
replicaCount: 1
registry: harbor.server.local/danielbeltejar/zgz-emergency-map-frontend
image:
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
extraEnv:
- name: "TZ"
  value: "UTC"
- name: "API_URL"
  value: "https://api.zgz-emergency-map.pre.danielbeltejar.es"
extraEnvFrom: []
resources:
  requests:
    memory: "64Mi"
    cpu: 100m
  limits:
    cpu: 500m
    memory: "256Mi"
volumes:
- name: tmpfs-var-lib-nginx-tmp
  emptyDir:
    medium: Memory
- name: tmpfs-run-nginx
  emptyDir:
    medium: Memory
volumeMounts:
- name: tmpfs-var-lib-nginx-tmp
  mountPath: /var/lib/nginx/tmp
- name: tmpfs-run-nginx
  mountPath: /run/nginx
gatewayRoute:
  enabled: true
  host: "zgz-emergency-map.pre.danielbeltejar.es"
  additionalHosts: []
  path: "/"

gateway:
  enabled: true
  name: cilium-local
  namespace: gateway-system
  sectionName: https-zgz-emergency-map-pre
