{{- $gateway := default (dict) .Values.gateway -}}
{{- if and .Values.gatewayRoute.enabled (default false $gateway.enabled) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app.fullname" . }}-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "gateway.name is required when gateway is enabled" $gateway.name }}
      namespace: {{ default "gateway-system" $gateway.namespace }}
      sectionName: {{ default "https" $gateway.sectionName }}
  hostnames:
    - {{ .Values.gatewayRoute.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ default "/" .Values.gatewayRoute.path | quote }}
      backendRefs:
        - name: {{ include "app.fullname" . }}-service
          port: {{ .Values.service.port }}
{{- end }}
