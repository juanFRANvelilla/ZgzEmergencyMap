namespace: pro-jf-zgz-emergency-map-back
replicaCount: 2
registry: harbor.server.local/danielbeltejar/zgzemergencymap
image:
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
probes:
  startup:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  readiness:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 5
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
extraEnv:
- name: "TZ"
  value: "UTC"
- name: "JAVA_OPTS"
  value: "-Xmx1024m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100"
extraEnvFrom:
- secretRef:
    name: backend-secrets
resources:
  requests:
    memory: "1Gi"
    cpu: 500m
  limits:
    memory: "2Gi"
    cpu: 2000m
gatewayRoute:
  enabled: true
  host: "api.zgz-emergency-map.juanfranciscoperez.es"
  path: "/"

gateway:
  enabled: true
  name: cilium-public
  namespace: gateway-system
  sectionName: https-api-zgz-emergency-map

# Configuración de base de datos
database:
  host: "zgz-emergency-map-db-rw.pro-jf-zgz-emergency-map-back.svc.cluster.local"
  port: "5432"
  name: "zgzEmergencyMap"
